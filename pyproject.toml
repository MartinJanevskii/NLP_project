[project]
name = "llm-knowledge-enhancement"
version = "0.1.0"
description = "How knowledge-graph context and prompt design shape LLM item descriptions in CoLaKG recommendation"
readme = "README.md"
authors = [
    { name = "viki123v", email = "viktorhristovski629@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tensorboardx==2.6.5",
    "torch==2.14.0",
    "tqdm==4.70.1",
    "transformers==5.17.0",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.8",
]

[tool.uv]
# Transitive versions of the environment the reported results were produced with.
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "click==8.5.0",
    "cloudpickle==3.1.2",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "filelock==4.0.1",
    "fonttools==4.65.0",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.32.0",
    "idna==3.20",
    "jinja2==3.1.6",
    "joblib==1.6.0",
    "kiwisolver==1.5.1",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "narwhals==2.26.0",
    "networkx==3.7",
    "packaging==26.3",
    "pillow==12.3.0",
    "protobuf==7.36.2",
    "pygments==2.21.0",
    "pyparsing==3.3.3",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "regex==2026.9.10",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "setuptools==84.0.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sympy==1.14.0",
    "threadpoolctl==3.7.0",
    "tokenizers==0.23.2",
    "typer==0.27.2",
    "typing-extensions==4.16.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
